// Aqua Browser startup. (The engine skips this first line.)
// Registers the Aqua package (chrome://aqua/) and hands over to boot.sys.mjs, which styles every window.
try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("aqua");
  const manifest = dir.clone();
  manifest.append("chrome.manifest");
  if (manifest.exists()) {
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.importESModule("chrome://aqua/content/boot.sys.mjs").AquaBoot.start();
  }
} catch (e) {
  Cu.reportError("Aqua Browser failed to start: " + e);
}
