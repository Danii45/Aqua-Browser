name: Build Aqua Browser

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish these builds as a GitHub release (yes/no)"
        default: "no"

permissions: { contents: write }

jobs:
  site:
    # GitHub Pages serves the gh-pages branch; this copies docs/ (built from site/ by build/site.py) there.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Publish the website
        env: { TOKEN: "${{ github.token }}" }
        run: |
          python3 build/site.py
          cd docs
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick unzip zip python3-pil libgtk-3-0t64 libasound2t64 libdbus-1-3 libx11-xcb1 libxtst6 fonts-dejavu >/dev/null
      - name: Get the engine (Mozilla's Firefox ESR, official build)
        run: |
          curl -fsSL -o engine.tar.xz "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=linux64&lang=en-US"
          mkdir -p work && tar -xf engine.tar.xz -C work
          grep -E "^Version" work/firefox/application.ini
      - name: Put Aqua on top
        run: bash build/ci-step.sh apply python3 build/apply.py linux work/firefox
      - name: Package .deb
        run: bash build/ci-step.sh deb bash build/make-deb.sh work/firefox
      - name: Install the .deb and check Aqua keeps its own profile folder
        run: |
          sudo apt-get install -y -qq ./dist/AquaBrowser-Linux-*.deb > /dev/null
          H="$(mktemp -d)"
          HOME="$H" bash build/ci-step.sh identity bash test/identity-check.sh /usr/bin/aqua-browser "$H/.aquabrowser/profiles.ini" shots
          test ! -e "$H/.mozilla/firefox/profiles.ini"
      - name: Screenshots
        run: bash build/ci-step.sh screenshots bash test/screenshots.sh "$PWD/work/firefox" shots
      - name: Save results
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: bash build/ci-save.sh linux
      - uses: actions/upload-artifact@v4
        with: { name: aqua-linux, path: dist/*.deb }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-linux, path: shots/ }

  mac:
    # Intel Mac runner: GitHub often has no free Apple Silicon Macs. The build is the same either way
    # (Firefox's Mac download is universal), and the profile check runs the Intel half.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: Get the engine (Mozilla's Firefox ESR, official build)
        run: curl -fsSL -o engine.dmg "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=osx&lang=en-US"
      - name: Build Aqua Browser.app
        run: bash build/ci-step.sh mac bash build/make-mac.sh engine.dmg
      - name: Check Aqua keeps its own profile folder on Mac
        run: |
          T="$(mktemp -d)"; unzip -q dist/AquaBrowser-Mac-*.zip -d "$T"
          bash build/ci-step.sh identity bash test/identity-check.sh "$T/Aqua Browser.app/Contents/MacOS/aqua-browser" "$HOME/Library/Application Support/AquaBrowser/profiles.ini" shots
      - name: Save results
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: bash build/ci-save.sh mac
      - uses: actions/upload-artifact@v4
        with: { name: aqua-mac, path: dist/*.zip }

  windows:
    runs-on: windows-2022
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python -m pip install --quiet pillow
          curl -fsSL -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          if [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then choco install nsis -y --no-progress; fi
      - name: Get the engine (Mozilla's Firefox ESR, official build)
        run: |
          curl -fsSL -o engine-setup.exe "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=win64&lang=en-US"
          7z x -y -owork engine-setup.exe >/dev/null
          grep -E "^Version" work/core/application.ini
      - name: Put Aqua on top
        run: bash build/ci-step.sh apply python build/apply.py windows work/core
      - name: Icon, installer, and a test install
        run: bash build/ci-step.sh installer bash build/windows/make-win.sh work/core
      - name: Screenshots
        continue-on-error: true
        shell: pwsh
        run: pwsh test/screenshots-windows.ps1 "$env:LOCALAPPDATA\Programs\Aqua Browser\firefox.exe" shots
      - name: Save results
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: bash build/ci-save.sh windows
      - uses: actions/upload-artifact@v4
        with: { name: aqua-windows, path: dist/*.exe }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-windows, path: shots/ }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.3.1" }
      - name: Signing key (if one has been added to the repository's secrets)
        env: { KEY_B64: "${{ secrets.AQUA_ANDROID_KEYSTORE }}" }
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/aqua.jks"; echo "AQUA_KEYSTORE=$RUNNER_TEMP/aqua.jks" >> "$GITHUB_ENV"; echo "signing with the Aqua key"; else echo "no key in secrets: signing with a throwaway key"; fi
      - name: Build the app
        env: { AQUA_KEYSTORE_PASSWORD: "${{ secrets.AQUA_ANDROID_KEYSTORE_PASSWORD }}" }
        run: bash build/ci-step.sh android bash -c "cd android && gradle --no-daemon --stacktrace assembleRelease"
      - name: Name the APKs
        run: |
          V="$(cat VERSION)"; mkdir -p dist
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/AquaBrowser-Android-$V.apk"
          ls -la android/app/build/outputs/apk/release/ dist/
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash test/android-shots.sh android/app/build/outputs/apk/release/app-x86_64-release.apk shots
      - name: Save results
        if: always()
        env: { TOKEN: "${{ github.token }}" }
        run: bash build/ci-save.sh android
      - uses: actions/upload-artifact@v4
        with: { name: aqua-android, path: dist/*.apk }

  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
    needs: [linux, mac, windows, android]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: aqua-*, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="$(cat VERSION)"
          # Same file names every version, so the website's .../releases/latest/download/<name> links always work.
          mkdir -p rel
          cp out/AquaBrowser-Linux-*-amd64.deb rel/AquaBrowser-Linux-amd64.deb
          cp out/AquaBrowser-Mac-*.zip rel/AquaBrowser-Mac.zip
          cp out/AquaBrowser-Windows-*-Setup.exe rel/AquaBrowser-Windows-Setup.exe
          cp out/AquaBrowser-Android-*.apk rel/AquaBrowser-Android.apk
          NOTES="Aqua Browser $V on Mozilla's open-source engine (Firefox ESR).
          - Kubuntu / Ubuntu / Debian: AquaBrowser-Linux-amd64.deb (open it with Discover, or sudo apt install ./AquaBrowser-Linux-amd64.deb)
          - Mac: AquaBrowser-Mac.zip (unzip, then right-click Install Aqua Browser.command → Open)
          - Windows 10/11: AquaBrowser-Windows-Setup.exe (if SmartScreen appears: More info → Run anyway)
          - Android 8+: AquaBrowser-Android.apk (open it on the phone and allow installing from your browser or files app)"
          gh release create "v$V" rel/* --title "Aqua Browser $V" --notes "$NOTES" || gh release upload "v$V" rel/* --clobber
